<div class="container-login">
  <div class="left-panel">
    <h1>Prancha <br><span>Web!</span></h1>
  </div>

  <div class="right-panel">
    <h3>Faça seu Login!</h3>
    <br>
    <form #loginForm="ngForm" (ngSubmit)="fazerLogin()">
      <!-- Usuário -->
      <!--div class="input-field">
        <input [(ngModel)]="usuario.username" name="username" id="username" type="text" required autocomplete="username" #username="ngModel">
        <label style="font-size: 20px;" for="username">Nome do usuário</label>
        <div *ngIf="username.invalid && username.touched" class="error-text" style="font-size: 20px;">
          O campo Nome do usuário é obrigatório!
        </div>
      </!--div-->

      <!-- Email -->
      <div class="input-field">
        <input [(ngModel)]="usuario.email" name="email" id="email" type="email" required autocomplete="email" #email="ngModel">
        <label style="font-size: 20px;" for="email">E-mail</label>
        <div *ngIf="email.invalid && email.touched" class="error-text" style="font-size: 20px;">
          O campo E-mail é obrigatório!
        </div>
      </div>

      <!-- Senha -->
      <div class="input-field">
        <input [(ngModel)]="usuario.senha" name="senha" id="senha" type="password" required autocomplete="current-password" #senha="ngModel">
        <label style="font-size: 20px;" for="senha">Senha</label>
        <div *ngIf="senha.invalid && senha.touched" class="error-text" style="font-size: 20px;">
          O campo Senha é obrigatório!
        </div>
      </div>

       <!-- NOVO: Mensagem de erro -->
      <div *ngIf="errorMessage" class="error-text" style="font-size: 18px; color: red; margin-bottom: 20px;">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn" [disabled]="loginForm.invalid || loading">
        <strong>{{ loading ? 'Entrando...' : 'Enviar' }}</strong>
        <i class="material-icons right">send</i>
      </button>

      <br><br><br>

      <!-- Botão para criar conta -->
      <p class="createaccount" (click)="abrirTermo()">Criar Conta</p>
    </form>
  </div>
</div>

<!-- Modal TCLE -->
<div id="modalTermo" class="modal">
  <div class="modal-content" style="max-height: 70vh; overflow-y: auto;">
    <h4>Termo de Consentimento Livre e Esclarecido (TCLE)</h4>
    <iframe src="../../assets/pdf/TCLE_versao final.pdf" width="100%" height="400px"></iframe>
  </div>
  <div class="modal-footer">
    <button class="modal-close btn green" (click)="aceitarTermo()">Sim, eu concordo</button>
    <button class="modal-close btn red" (click)="recusarTermo()">Não concordo</button>
  </div>
</div>

<!-- Aviso de recusa -->
<div class="overlay" *ngIf="mostrarAviso">
  <div class="aviso-container">
    <h3>Não é possível criar a conta</h3>
    <p>É necessário aceitar o Termo de Consentimento Livre e Esclarecido (TCLE) para continuar.</p>
    <button class="btn white-text" (click)="fecharAviso()">Entendi</button>
  </div>
</div>
