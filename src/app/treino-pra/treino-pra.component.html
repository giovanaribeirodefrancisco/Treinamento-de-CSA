<!-- Tela de loading enquanto verifica status do vídeo -->
<div class="loading-screen" *ngIf="carregandoStatusVideo">
  <div class="loading-content">
    <div class="spinner"></div>
    <p>Preparando treinamento prático...</p>
  </div>
</div>

        [ngClass]="{'item-selecionado': itemSelecionado('Pode')}"
        [attr.data-texto]="'Pode'">
          <img src="assets/imagem/pictogramasTextoGrande/6I.png"
              alt="Pode"
              (click)="mostrarTextoESom('Pode')"
              style="cursor: pointer;" />
        </div>
        <div class="item" style="grid-row: 6; grid-column: 10;"
        [ngClass]="{'item-selecionado': itemSelecionado('Outro')}"
        [attr.data-texto]="'Outro'">
          <img src="assets/imagem/pictogramasTextoGrande/6J.png"
              alt="Outro"
              (click)="mostrarTextoESom('Outro')"
              style="cursor: pointer;" />
        </div>
      </div>

      <div class="area-texto" *ngIf="textoExibido">
        <p>{{ textoExibido }}</p>
      </div>

      <div class="feedback-mensagem" *ngIf="mostrarFeedback" [ngClass]="tipoFeedback">
      {{ mensagemFeedback }}

        <!--div *ngIf="isDicaUsadaNaEtapaAtual()" class="aviso-dica">
            <div class="contador-dicas">
            Dicas usadas: {{ getQuantidadeDicasUsadas(etapa) }}
          </div>
        </!--div-->

      </div>

      <div class="acoes">
        <button class="btn-acao" style="background-color: rgb(255, 135, 23)" (click)="dica()">Dica</button>
        <br>
        <button class="btn-acao" style="background-color: rgb(201, 19, 242)" (click)="limparSelecao()">Limpar Seleção</button>
        <br>
        <button class="btn-acao" style="background-color: rgb(29, 191, 8)" (click)="finalizar()">Finalizar</button>
      </div>
    </div>

     <!-- Tela de conclusão quando etapa === 23 -->
    <div class="conclusao" *ngIf="etapa === 23">
      <app-enunciados [etapa]="etapa"></app-enunciados>
    </div>


  </div>

</div>
